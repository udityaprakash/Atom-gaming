name: Build & Publish Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Fat-Free Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Compute Dynamic Version & Build Metadata
        id: versioning
        run: |
          # Set local timezone to IST (Asia/Kolkata)
          export TZ='Asia/Kolkata'
          
          # Compute date components without leading zeroes
          DAY=$(date +'%-d')
          MONTH=$(date +'%-m')
          TIME=$(date +'%H%M')
          FULL_DATE=$(date +'%d %B %Y, %I:%M %p IST')
          
          # Formatted as 0.<day>.<month>.<time in minute precision>
          # Example for 8 November at 14:30 -> 0.8.11.1430
          VERSION="0.${DAY}.${MONTH}.${TIME}"
          TAG_NAME="v${VERSION}"
          
          # Strictly increasing Android versionCode (timestamp in minutes)
          BUILD_NUMBER=$(($(date +'%s') / 60))
          
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "FULL_DATE=${FULL_DATE}" >> $GITHUB_OUTPUT
          
          echo "=========================================="
          echo "Calculated Version : ${VERSION}"
          echo "Git Tag Name       : ${TAG_NAME}"
          echo "Android Build No   : ${BUILD_NUMBER}"
          echo "Release Timestamp  : ${FULL_DATE}"
          echo "=========================================="

      - name: Make Gradlew Executable
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Fat-Free Split Release APKs
        run: |
          flutter build apk --release --split-per-abi \
            --build-name="${{ steps.versioning.outputs.VERSION }}" \
            --build-number="${{ steps.versioning.outputs.BUILD_NUMBER }}"

      - name: Organize & Rename Release Artifacts
        run: |
          mkdir -p release-apks
          VERSION="${{ steps.versioning.outputs.VERSION }}"
          APK_DIR="build/app/outputs/flutter-apk"
          
          if [ -f "$APK_DIR/app-arm64-v8a-release.apk" ]; then
            cp "$APK_DIR/app-arm64-v8a-release.apk" "release-apks/atom-v${VERSION}-arm64-v8a.apk"
          fi
          
          if [ -f "$APK_DIR/app-armeabi-v7a-release.apk" ]; then
            cp "$APK_DIR/app-armeabi-v7a-release.apk" "release-apks/atom-v${VERSION}-armeabi-v7a.apk"
          fi
          
          if [ -f "$APK_DIR/app-x86_64-release.apk" ]; then
            cp "$APK_DIR/app-x86_64-release.apk" "release-apks/atom-v${VERSION}-x86_64.apk"
          fi
          
          echo "Generated Fat-Free Release APKs:"
          ls -lh release-apks/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.TAG_NAME }}
          name: "atom Release v${{ steps.versioning.outputs.VERSION }}"
          draft: false
          prerelease: false
          make_latest: true
          files: release-apks/*.apk
          body: |
            ## 🎮 atom v${{ steps.versioning.outputs.VERSION }}
            
            **Released On:** ${{ steps.versioning.outputs.FULL_DATE }}
            **Trigger:** Commit push to `main` (`${{ github.sha }}`)
            
            ---
            
            ### 📦 Download Fat-Free Release APKs
            These APKs are built with `--split-per-abi`, making them lean and eliminating redundant multi-architecture binary bloat:
            
            * 📱 **`atom-v${{ steps.versioning.outputs.VERSION }}-arm64-v8a.apk`** *(Recommended)*: For modern Android phones & tablets (64-bit ARM).
            * 📲 **`atom-v${{ steps.versioning.outputs.VERSION }}-armeabi-v7a.apk`**: For legacy 32-bit Android devices.
            * 💻 **`atom-v${{ steps.versioning.outputs.VERSION }}-x86_64.apk`**: For Android emulators & Chromebooks.
            
            ---
            *Built automatically via GitHub Actions* 🚀
